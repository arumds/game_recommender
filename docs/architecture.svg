<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; fill: #1d1d1b; }
      .b  { font-size: 12px; fill: #3d3d39; }
      .m  { font-size: 12px; fill: #6b6b66; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: .06em; fill: #4a4a46; }
      .lbl { font-size: 11px; font-style: italic; fill: #6b6b66; }
      .ln { stroke: #4a4a46; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="960" fill="#ffffff"/>

  <!-- title -->
  <text x="20" y="38" font-size="22" font-weight="700" fill="#1d1d1b">Steam game recommender: architecture</text>
  <text x="1380" y="38" text-anchor="end" class="m">two-stage retrieval + learned ranking + guardrails · UCSD Steam data</text>

  <!-- ===================== OFFLINE ===================== -->
  <rect x="20" y="62" width="1360" height="448" rx="12" fill="#fafaf8" stroke="#d6d6d0"/>
  <text x="40" y="90" class="band">OFFLINE TRAINING · src/main.py</text>
  <text x="1360" y="90" text-anchor="end" class="m">≈4 min on CPU · two-tower trains in a child process (torch / LightGBM OpenMP clash on macOS)</text>

  <!-- raw data -->
  <rect x="40" y="112" width="230" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57"/>
  <text x="52" y="134" class="t">Raw data (UCSD Steam)</text>
  <text x="52" y="156" class="b">australian_users_items.json.gz</text>
  <text x="52" y="173" class="m">players · games owned · playtime</text>
  <text x="52" y="194" class="b">steam_games.json.gz</text>

  <!-- prep -->
  <rect x="40" y="222" width="230" height="114" rx="8" fill="#e7f5ec" stroke="#2e8b57"/>
  <text x="52" y="244" class="t">data_loader · features</text>
  <text x="52" y="264" class="b">45,791 players × 3,750 games</text>
  <text x="52" y="282" class="b">per-player 80/20 game holdout</text>
  <text x="52" y="300" class="b">game features: genres, tags,</text>
  <text x="52" y="318" class="b">price, year, in-app purchases</text>
  <path class="ln" d="M155,204 V220"/>

  <!-- ALS -->
  <rect x="320" y="112" width="250" height="96" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
  <text x="332" y="134" class="t">ALS (implicit)</text>
  <text x="332" y="156" class="b">matrix factorization on playtime</text>
  <text x="332" y="174" class="b">64 factors</text>
  <text x="332" y="196" class="m">→ top-50 games per player</text>

  <!-- two-tower -->
  <rect x="320" y="226" width="250" height="114" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
  <text x="332" y="248" class="t">Two-tower (PyTorch)</text>
  <text x="332" y="270" class="b">player: id + taste profile + #games</text>
  <text x="332" y="288" class="b">game: id + tags + price + year</text>
  <text x="332" y="306" class="b">in-batch softmax, logQ correction</text>
  <text x="332" y="328" class="m">→ top-50 games per player</text>

  <path class="ln" d="M270,250 L318,170"/>
  <path class="ln" d="M270,285 L318,285"/>

  <!-- merge -->
  <rect x="620" y="150" width="170" height="150" rx="8" fill="#f1f1ee" stroke="#8a8a84"/>
  <text x="632" y="172" class="t">Candidate merge</text>
  <text x="632" y="194" class="b">ALS ∪ two-tower</text>
  <text x="632" y="212" class="b">≤ 100 games / player</text>
  <text x="632" y="236" class="b">keeps each source's</text>
  <text x="632" y="254" class="b">rank as a feature</text>
  <path class="ln" d="M570,160 L618,200"/>
  <path class="ln" d="M570,283 L618,250"/>

  <!-- ranker -->
  <rect x="840" y="112" width="250" height="208" rx="8" fill="#efe9fb" stroke="#7b4fd6"/>
  <text x="852" y="134" class="t">LightGBM LambdaMART ranker</text>
  <text x="852" y="156" class="b">17 features:</text>
  <text x="852" y="174" class="b">· retriever scores and ranks</text>
  <text x="852" y="192" class="b">· game popularity, price, year, IAP</text>
  <text x="852" y="210" class="b">· player history, recent hours</text>
  <text x="852" y="228" class="b">· taste affinity, price gap</text>
  <text x="852" y="254" class="b">labels: held-out hours → grade 1/2/3</text>
  <text x="852" y="272" class="b">trained on 70% of players</text>
  <text x="852" y="304" class="m">featurize.py shared with serving</text>
  <path class="ln" d="M790,225 L838,225"/>

  <!-- guardrails -->
  <rect x="1140" y="112" width="220" height="208" rx="8" fill="#fdf3e1" stroke="#c98a12"/>
  <text x="1152" y="134" class="t">Guardrails</text>
  <text x="1152" y="158" class="b">1. Heavy players (≥ 30.65 h in</text>
  <text x="1152" y="176" class="b">    last 2 weeks, top 25%) get no</text>
  <text x="1152" y="194" class="b">    in-app-purchase games</text>
  <text x="1152" y="220" class="b">2. MMR diversity re-rank</text>
  <text x="1152" y="238" class="b">    (λ = 0.7) for everyone</text>
  <text x="1152" y="272" class="m">→ final top-10</text>
  <path class="ln" d="M1090,225 L1138,225"/>

  <!-- artifacts -->
  <rect x="40" y="366" width="840" height="124" rx="8" fill="#f1f1ee" stroke="#8a8a84"/>
  <text x="52" y="388" class="t">models/ · artifacts for serving</text>
  <text x="52" y="410" class="b">tables.npz: ALS + two-tower vectors, game and player feature tables  ·  seen.npz: games each player owns</text>
  <text x="52" y="428" class="b">ranker.txt: LightGBM model  ·  meta.json: ids, names, heavy-player threshold</text>
  <text x="52" y="446" class="b">feature_reference.json: drift baseline  ·  model_metadata.json: trained_at, NDCG</text>
  <text x="52" y="474" class="m">no torch needed at serving time: the two-tower is reduced to saved vectors</text>
  <path class="ln" d="M865,320 V364"/>

  <!-- evaluation -->
  <rect x="920" y="366" width="440" height="124" rx="8" fill="#f1f1ee" stroke="#8a8a84"/>
  <text x="932" y="388" class="t">Evaluation · 13,738 held-out players (30%)</text>
  <text x="932" y="410" class="b">NDCG@10: popularity 0.230 · ALS 0.248</text>
  <text x="932" y="428" class="b">two-tower 0.263 · RRF fusion 0.282</text>
  <text x="932" y="446" class="b" font-weight="600">ranker 0.321 · ranker + guardrails 0.294</text>
  <text x="932" y="474" class="m">paired bootstrap CIs → outputs/results.json</text>
  <path class="ln" d="M1250,320 V364"/>

  <!-- ===================== ONLINE ===================== -->
  <rect x="20" y="540" width="1360" height="396" rx="12" fill="#fafaf8" stroke="#d6d6d0"/>
  <text x="40" y="568" class="band">ONLINE SERVING · src/app.py (FastAPI)</text>
  <text x="1360" y="568" text-anchor="end" class="m">Docker image · numpy + LightGBM only · python src/app.py → :8000</text>

  <!-- load arrow -->
  <path class="ln" d="M530,490 V608"/>
  <text x="540" y="590" class="lbl">loaded at startup</text>

  <!-- client -->
  <rect x="40" y="610" width="170" height="100" rx="8" fill="#ffffff" stroke="#8a8a84"/>
  <text x="52" y="632" class="t">Client</text>
  <text x="52" y="654" class="b">GET /recommend</text>
  <text x="52" y="672" class="b">?user_id=…&amp;k=10</text>
  <text x="52" y="690" class="b">&amp;guardrails=true</text>

  <!-- decision -->
  <polygon points="320,615 390,660 320,705 250,660" fill="#ffffff" stroke="#8a8a84"/>
  <text x="320" y="656" text-anchor="middle" class="b">known</text>
  <text x="320" y="672" text-anchor="middle" class="b">player?</text>
  <path class="ln" d="M210,660 L248,660"/>
  <path class="ln" d="M390,660 L428,660"/>
  <text x="398" y="652" class="lbl">yes</text>
  <path class="ln" d="M320,705 V748"/>
  <text x="328" y="732" class="lbl">no</text>

  <!-- fallback -->
  <rect x="250" y="750" width="140" height="56" rx="8" fill="#ffffff" stroke="#8a8a84"/>
  <text x="262" y="772" class="t">Popularity list</text>
  <text x="262" y="792" class="m">cold-start fallback</text>
  <path class="ln" d="M390,778 H1245 V712"/>

  <!-- retrieval -->
  <rect x="430" y="610" width="200" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
  <text x="442" y="632" class="t">1 · Retrieval</text>
  <text x="442" y="652" class="b">dot products on saved</text>
  <text x="442" y="668" class="b">ALS + two-tower vectors,</text>
  <text x="442" y="684" class="b">owned games excluded,</text>
  <text x="442" y="700" class="b">merged to ≤ 100</text>
  <path class="ln" d="M630,660 L668,660"/>

  <!-- ranking -->
  <rect x="670" y="610" width="190" height="100" rx="8" fill="#efe9fb" stroke="#7b4fd6"/>
  <text x="682" y="632" class="t">2 · Ranking</text>
  <text x="682" y="652" class="b">featurize.py builds the</text>
  <text x="682" y="668" class="b">same 17 features as in</text>
  <text x="682" y="684" class="b">training (no skew)</text>
  <text x="682" y="700" class="b">→ LightGBM scores</text>
  <path class="ln" d="M860,660 L898,660"/>

  <!-- guardrails -->
  <rect x="900" y="610" width="190" height="100" rx="8" fill="#fdf3e1" stroke="#c98a12"/>
  <text x="912" y="632" class="t">3 · Guardrails</text>
  <text x="912" y="652" class="b">IAP filter if heavy player</text>
  <text x="912" y="668" class="b">MMR diversity re-rank</text>
  <text x="912" y="690" class="m">guardrails=false skips</text>
  <path class="ln" d="M1090,660 L1128,660"/>

  <!-- response -->
  <rect x="1130" y="610" width="230" height="100" rx="8" fill="#ffffff" stroke="#8a8a84"/>
  <text x="1142" y="632" class="t">Response (JSON)</text>
  <text x="1142" y="652" class="b">top-k games + IAP flag</text>
  <text x="1142" y="668" class="b">heavy_recent_player</text>
  <text x="1142" y="684" class="b">latency_ms per stage</text>

  <!-- to monitor -->
  <path class="ln" d="M1330,710 V828"/>
  <text x="1322" y="800" text-anchor="end" class="lbl">timings + ranker inputs</text>

  <!-- similar / health -->
  <rect x="40" y="830" width="360" height="86" rx="8" fill="#ffffff" stroke="#8a8a84"/>
  <text x="52" y="852" class="t">GET /similar/{item_id} · cross-sell</text>
  <text x="52" y="872" class="b">cosine similarity of ALS game vectors</text>
  <text x="52" y="890" class="b">e.g. CS:GO → Left 4 Dead 2, Garry's Mod</text>
  <text x="52" y="908" class="m">GET /health · readiness</text>

  <!-- monitoring -->
  <rect x="440" y="830" width="920" height="86" rx="8" fill="#e3f4f4" stroke="#1f8a8a"/>
  <text x="452" y="852" class="t">monitoring.py · every request is measured</text>
  <text x="452" y="872" class="b">latency p50 / p95 / p99 per stage (SLO 100 ms) · 5xx rate · counters: cold-start fallbacks, IAP-filtered players</text>
  <text x="452" y="890" class="b">feature drift: PSI of live ranker inputs vs feature_reference.json (warn ≥ 0.1, alert ≥ 0.25) · model age (alert &gt; 168 h)</text>
  <text x="452" y="908" class="m">→ GET /monitoring (JSON with alerts) · GET /dashboard (page that refreshes every 5 s)</text>
</svg>
